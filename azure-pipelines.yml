trigger:
- main
- feature/*

pool: Default

parameters:
- name: env
  displayName: Select Environment
  type: string
  default: dev
  values: 
    - dev
    - prod
- name: TFLint
  displayName: execute TFLint ?
  type: boolean
  default: true

variables:
- ${{ if eq(parameters.env, 'dev')}}:
  - group: VG-dev
- ${{ if eq(parameters.env, 'prod')}}:
  - group: VG-prod
- name: wd
  value: $(System.DefaultWorkingDirectory)/landing_zone_practice/Environment/${{ parameters.env }}

stages:
  - stage: Validate
    displayName: Terraform Init and Validate
    jobs:
    - job: InitandValidate
      displayName: Terraform Init and Validate
      steps:
      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(wd)'
          backendServiceArm: 'Practice_service_connection'
          backendAzureRmResourceGroupName: '$(rg)'
          backendAzureRmStorageAccountName: '$(sa)'
          backendAzureRmContainerName: '$(container)'
          backendAzureRmKey: '$(key)'
      - task: TerraformTask@5
        displayName: Terraform Vakidate
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(wd)'
  - stage: TFLint
    displayName: TFLint execution
    condition: and(succeeded(),eq('${{ parameters.TFLint}}', 'true'))
    jobs: 
    - job: TFLint
      displayName: TFLint execution
      steps:
      - task: PowerShell@2
        displayName: TFLint
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            
            # Install TFLint in agent's temporary directory
            $installDir = "$(Agent.TempDirectory)\tflint"
            $zipPath = "$installDir\tflint.zip"
            
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            
            # Download latest Windows AMD64 release
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/terraform-linters/tflint/releases/latest"
            
            $asset = $release.assets |
              Where-Object { $_.name -match "windows_amd64\.zip$" } |
              Select-Object -First 1
            
            if (-not $asset) {
                throw "Could not find TFLint Windows AMD64 release."
            }
            
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            
            Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
            
            $tflint = Join-Path $installDir "tflint.exe"
            
            if (-not (Test-Path $tflint)) {
                throw "tflint.exe was not found after extraction."
            }
            
            # Verify
            & $tflint --version
            if ($LASTEXITCODE -ne 0) {
                throw "TFLint version check failed."
            }
            
            # Initialize and scan
            & $tflint --init
            if ($LASTEXITCODE -ne 0) {
                throw "TFLint plugin initialization failed."
            }
            
            & $tflint --format compact
            if ($LASTEXITCODE -ne 0) {
                throw "TFLint scan failed or found issues."
            }

      - task: PowerShell@2
        displayName: TFSec
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            
            # Install tfsec in Azure DevOps agent's temp directory
            $installDir = Join-Path $env:AGENT_TEMPDIRECTORY "tfsec"
            $zipPath = Join-Path $installDir "tfsec.zip"
            
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            
            # Get latest official tfsec Windows release
            $release = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/aquasecurity/tfsec/releases/latest"
            
            $asset = $release.assets |
                Where-Object { $_.name -eq "tfsec-windows-amd64.exe" } |
                Select-Object -First 1
            
            if (-not $asset) {
                $asset = $release.assets |
                    Where-Object { $_.name -match "tfsec.*windows.*amd64.*\.exe$" -and $_.name -notmatch "\.sig$" } |
                    Select-Object -First 1
            }
            
            if (-not $asset) {
                throw "Could not find the official tfsec Windows AMD64 executable."
            }
            
            $tfsec = Join-Path $installDir "tfsec.exe"
            
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tfsec
            
            if (-not (Test-Path $tfsec)) {
                throw "tfsec.exe download failed."
            }
            
            # Verify installation
            & $tfsec --version
            if ($LASTEXITCODE -ne 0) {
                throw "tfsec version check failed."
            }
            
            # Run scan against repository Terraform files
            $scanDir = "$(Build.SourcesDirectory)"
            
            & $tfsec $scanDir --format lovely
            
            if ($LASTEXITCODE -ne 0) {
                throw "tfsec found security issues or the scan failed."
            }
            
            Write-Host "tfsec scan completed successfully."
      - task: PowerShell@2
        displayName: CheckOv
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            
            # 1. Install Python using winget if missing
            $pythonCmd = Get-Command python -ErrorAction SilentlyContinue
            $pyCmd = Get-Command py -ErrorAction SilentlyContinue
            
            if (-not $pythonCmd -and -not $pyCmd) {
                Write-Host "Python not found. Installing Python..."
            
                $winget = Get-Command winget -ErrorAction SilentlyContinue
                if (-not $winget) {
                    throw "WinGet is unavailable. Install Python 3 manually on the agent first."
                }
            
                winget install --exact --id Python.Python.3.12 `
                    --scope user --silent `
                    --accept-package-agreements `
                    --accept-source-agreements
            
                if ($LASTEXITCODE -ne 0) {
                    throw "Python installation failed."
                }
            }
            
            # 2. Refresh PATH and locate Python executable
            $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
                        [Environment]::GetEnvironmentVariable("Path", "User")
            
            $pythonExe = $null
            
            $pythonCandidates = @(
                "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
                "$env:ProgramFiles\Python312\python.exe"
            )
            
            foreach ($candidate in $pythonCandidates) {
                if (Test-Path $candidate) {
                    $pythonExe = $candidate
                    break
                }
            }
            
            if (-not $pythonExe) {
                $cmd = Get-Command python -ErrorAction SilentlyContinue
                if ($cmd -and $cmd.Source -notlike "*WindowsApps*") {
                    $pythonExe = $cmd.Source
                }
            }
            
            if (-not $pythonExe) {
                $py = Get-Command py -ErrorAction SilentlyContinue
                if ($py) {
                    $pythonExe = ( & $py.Source -3.12 -c "import sys; print(sys.executable)" ).Trim()
                }
            }
            
            if (-not $pythonExe -or -not (Test-Path $pythonExe)) {
                throw "Python executable not found. Install Python 3.12 and rerun."
            }
            
            & $pythonExe --version
            if ($LASTEXITCODE -ne 0) {
                throw "Python verification failed."
            }
            
            # 3. Create isolated virtual environment
            $installDir = Join-Path $env:AGENT_TEMPDIRECTORY "checkov"
            $venvDir = Join-Path $installDir "venv"
            $venvPython = Join-Path $venvDir "Scripts\python.exe"
            $checkovExe = Join-Path $venvDir "Scripts\checkov.exe"
            
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            
            if (-not (Test-Path $venvPython)) {
                & $pythonExe -m venv $venvDir
                if ($LASTEXITCODE -ne 0) {
                    throw "Failed to create virtual environment."
                }
            }
            
            # 4. Install Checkov
            & $venvPython -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) {
                throw "pip upgrade failed."
            }
            
            & $venvPython -m pip install checkov
            if ($LASTEXITCODE -ne 0) {
                throw "Checkov installation failed."
            }
            
            # 5. Verify Checkov
            & $checkovExe --version
            if ($LASTEXITCODE -ne 0) {
                throw "Checkov verification failed."
            }
            
            # 6. Run Terraform scan
            $scanDir = "$(Build.SourcesDirectory)"
            
            & $checkovExe -d $scanDir --framework terraform --output cli
            $scanExitCode = $LASTEXITCODE
            
            if ($scanExitCode -ne 0) {
                throw "Checkov reported failed checks or encountered an error. Review scan output."
            }
            
            Write-Host "Checkov scan completed successfully."


  - stage: Plan
    displayName: Terraform Plan
    jobs:
    - job: Plan
      displayName: Terraform Plan
      steps:
      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(wd)'
          backendServiceArm: 'Practice_service_connection'
          backendAzureRmResourceGroupName: '$(rg)'
          backendAzureRmStorageAccountName: '$(sa)'
          backendAzureRmContainerName: '$(container)'
          backendAzureRmKey: '$(key)'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(wd)'
          environmentServiceNameAzureRM: 'Practice_service_connection'