trigger:
- main
- feature/*

pool: Default

parameters:
- name: env
  displayName: Select Environment
  type: string
  default: dev
  values: 
    - dev
    - prod
- name: TFLint
  displayName: execute TFLint ?
  type: boolean
  default: true

variables:
- ${{ if eq(parameters.env, 'dev')}}:
  - group: VG-dev
- ${{ if eq(parameters.env, 'prod')}}:
  - group: VG-prod
- name: wd
  value: $(System.DefaultWorkingDirectory)landing_zone_practice/Environment/${{ parameters.env }}

stages:
  - stage: Validate
    displayName: Terraform Init and Validate
    jobs:
    - job: InitandValidate
      displayName: Terraform Init and Validate
      steps:
      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(wd)'
          backendServiceArm: 'Practice_service_connection'
          backendAzureRmResourceGroupName: '$(rg)'
          backendAzureRmStorageAccountName: '$(sa)'
          backendAzureRmContainerName: '$(container)'
          backendAzureRmKey: '$(key)'
      - task: TerraformTask@5
        displayName: Terraform Vakidate
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(wd)'
  - stage: TFLint
    displayName: TFLint execution
    condition: and(succeeded(),eq('${{ parameters.TFLint}}', 'true'))
    jobs: 
    - job: TFLint
      displayName: TFLint execution
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            # Install TFLint using WinGet
            winget install --exact --id TerraformLinters.tflint --silent --accept-package-agreements --accept-source-agreements
            
            # Verify installation
            tflint --version
            
            # Initialize plugins
            tflint --init
            
            # Run TFLint scan
            tflint --format compact
            
            # Check exit code
            if ($LASTEXITCODE -ne 0) {
                Write-Error "TFLint scan failed or found issues."
                exit 1
            }
            else {
                Write-Host "TFLint scan completed successfully."
            }
  - stage: Plan
    displayName: Terraform Plan
    jobs:
    - job: Plan
      displayName: Terraform Plan
      steps:
      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(wd)'
          backendServiceArm: 'Practice_service_connection'
          backendAzureRmResourceGroupName: '$(rg)'
          backendAzureRmStorageAccountName: '$(sa)'
          backendAzureRmContainerName: '$(container)'
          backendAzureRmKey: '$(key)'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(wd)'
          environmentServiceNameAzureRM: 'Practice_service_connection'