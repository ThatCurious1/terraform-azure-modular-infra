trigger: 
- main
- feature/*

pool: Default

parameters:
- name: env
  displayName: Select Environment
  type: string
  default: dev
  values: 
    - dev
    - prod
- name: TFLint
  displayName: execute TFLint ?
  type: boolean
  default: true

- name: TFSec
  displayName: execute TFSec ?
  type: boolean
  default: true

- name: GITLeaks
  displayName: execute GITLeaks ?
  type: boolean
  default: true  
  
- name: trivy
  displayName: execute trivy ?
  type: boolean
  default: true  

variables:
- ${{ if eq(parameters.env, 'dev')}}:
  - group: VG-dev
- ${{ if eq(parameters.env, 'prod')}}:
  - group: VG-prod
- name: wd
  value: $(System.DefaultWorkingDirectory)/Environment/${{ parameters.env }}

stages:
  - stage: Validate
    displayName: Terraform Init and Validate
    jobs:
    - job: InitandValidate
      displayName: Terraform Init and Validate
      steps:
      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(wd)'
          backendServiceArm: 'Practice_service_connection'
          backendAzureRmResourceGroupName: '$(rg)'
          backendAzureRmStorageAccountName: '$(sa)'
          backendAzureRmContainerName: '$(container)'
          backendAzureRmKey: '$(key)'
      - task: TerraformTask@5
        displayName: Terraform Vakidate
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(wd)'
  - stage: TFLint
    displayName: TFLint execution
    dependsOn: []
    condition: and(succeeded(),eq('${{ parameters.TFLint}}', 'true'))
    jobs: 
    - job: TFLint
      displayName: TFLint execution
      steps:
      - task: PowerShell@2
        displayName: TFLint
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            
            # Install TFLint in agent's temporary directory
            $installDir = "$(Agent.TempDirectory)\tflint"
            $zipPath = "$installDir\tflint.zip"
            
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            
            # Download latest Windows AMD64 release
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/terraform-linters/tflint/releases/latest"
            
            $asset = $release.assets |
              Where-Object { $_.name -match "windows_amd64\.zip$" } |
              Select-Object -First 1
            
            if (-not $asset) {
                throw "Could not find TFLint Windows AMD64 release."
            }
            
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            
            Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
            
            $tflint = Join-Path $installDir "tflint.exe"
            
            if (-not (Test-Path $tflint)) {
                throw "tflint.exe was not found after extraction."
            }
            
            # Verify
            & $tflint --version
            if ($LASTEXITCODE -ne 0) {
                throw "TFLint version check failed."
            }
            
            # Initialize and scan
            & $tflint --init
            if ($LASTEXITCODE -ne 0) {
                throw "TFLint plugin initialization failed."
            }
            
            & $tflint --format compact
            if ($LASTEXITCODE -ne 0) {
                throw "TFLint scan failed or found issues."
            }
  - stage: TFSec
    displayName: TFSec
    dependsOn: []
    condition: and(succeeded(),eq('${{ parameters.TFSec}}', 'true'))
    jobs: 
    - job: TFSec
      displayName: TFSec execution
      steps:
      - task: PowerShell@2
        displayName: TFSec
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            
            # Install tfsec in Azure DevOps agent's temp directory
            $installDir = Join-Path $env:AGENT_TEMPDIRECTORY "tfsec"
            $zipPath = Join-Path $installDir "tfsec.zip"
            
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
            
            # Get latest official tfsec Windows release
            $release = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/aquasecurity/tfsec/releases/latest"
            
            $asset = $release.assets |
                Where-Object { $_.name -eq "tfsec-windows-amd64.exe" } |
                Select-Object -First 1
            
            if (-not $asset) {
                $asset = $release.assets |
                    Where-Object { $_.name -match "tfsec.*windows.*amd64.*\.exe$" -and $_.name -notmatch "\.sig$" } |
                    Select-Object -First 1
            }
            
            if (-not $asset) {
                throw "Could not find the official tfsec Windows AMD64 executable."
            }
            
            $tfsec = Join-Path $installDir "tfsec.exe"
            
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tfsec
            
            if (-not (Test-Path $tfsec)) {
                throw "tfsec.exe download failed."
            }
            
            # Verify installation
            & $tfsec --version
            if ($LASTEXITCODE -ne 0) {
                throw "tfsec version check failed."
            }
            
            # Run scan against repository Terraform files
            $scanDir = "$(Build.SourcesDirectory)"
            
            & $tfsec $scanDir --format lovely
            
            if ($LASTEXITCODE -ne 0) {
                throw "tfsec found security issues or the scan failed."
            }
            
            Write-Host "tfsec scan completed successfully."
  - stage: GITLeaks
    displayName: GITLeaks execution
    dependsOn: []
    condition: and(succeeded(),eq('${{ parameters.GITLeaks}}', 'true'))
    jobs: 
    - job: GITLeaks
      displayName: GITLeaks execution
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            
            # Install Gitleaks
            $installDir = Join-Path $env:AGENT_TEMPDIRECTORY "gitleaks"
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            
            $release = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
            
            $asset = $release.assets |
                Where-Object { $_.name -match "windows_x64\.zip$" } |
                Select-Object -First 1
            
            if (-not $asset) {
                throw "Gitleaks Windows x64 release not found."
            }
            
            $zipPath = Join-Path $installDir "gitleaks.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
            
            $gitleaks = Join-Path $installDir "gitleaks.exe"
            
            if (-not (Test-Path $gitleaks)) {
                throw "gitleaks.exe not found after extraction."
            }
            
            # Verify
            & $gitleaks version
            if ($LASTEXITCODE -ne 0) {
                throw "Gitleaks installation verification failed."
            }
            
            # Scan Git repository
            $repoDir = "$(Build.SourcesDirectory)"
            
            & $gitleaks git $repoDir --redact --report-format json `
                --report-path (Join-Path $installDir "gitleaks-report.json")
            
            if ($LASTEXITCODE -ne 0) {
                throw "Gitleaks found secrets or the scan failed. Review the report."
            }
            
            Write-Host "Gitleaks scan completed successfully."
  - stage: trivy
    displayName: trivy execution
    dependsOn: []
    condition: and(succeeded(),eq('${{ parameters.trivy}}', 'true'))
    jobs: 
    - job: trivy
      displayName: trivy execution
      steps:
      - task: PowerShell@2
        displayName: trivy
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Stop"
            
            # Install Trivy
            $installDir = Join-Path $env:AGENT_TEMPDIRECTORY "trivy"
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            
            $release = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"
            
            $asset = $release.assets |
                Where-Object { $_.name -match "windows-64bit\.zip$" } |
                Select-Object -First 1
            
            if (-not $asset) {
                throw "Trivy Windows 64-bit release not found."
            }
            
            $zipPath = Join-Path $installDir "trivy.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
            
            $trivy = Join-Path $installDir "trivy.exe"
            
            if (-not (Test-Path $trivy)) {
                throw "trivy.exe not found after extraction."
            }
            
            # Verify
            & $trivy --version
            if ($LASTEXITCODE -ne 0) {
                throw "Trivy installation verification failed."
            }
            
            # Scan Terraform / IaC configuration
            $scanDir = "$(Build.SourcesDirectory)"
            $report = Join-Path $installDir "trivy-report.json"
            
            & $trivy config --format json --output $report $scanDir
            $scanExitCode = $LASTEXITCODE
            
            if ($scanExitCode -ne 0) {
                throw "Trivy scan failed. Check logs and report."
            }
            
            Write-Host "Trivy scan completed. Report: $report"
  - stage: Plan
    displayName: Terraform Plan
    jobs:
    - job: Plan
      displayName: Terraform Plan
      steps:
      - task: TerraformTask@5
        displayName: Terraform Init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(wd)'
          backendServiceArm: 'Practice_service_connection'
          backendAzureRmResourceGroupName: '$(rg)'
          backendAzureRmStorageAccountName: '$(sa)'
          backendAzureRmContainerName: '$(container)'
          backendAzureRmKey: '$(key)'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(wd)'
          environmentServiceNameAzureRM: 'Practice_service_connection'