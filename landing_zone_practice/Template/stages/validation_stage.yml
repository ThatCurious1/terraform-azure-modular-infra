parameters:
- name: Environment
  type: string

- name: wd
  type: string

- name: serviceConnection
  type: string
  default: 'Practice_service_connection'

stages:
- stage: validation_${{ parameters.Environment }}
  displayName: Terraform Init and Validate ${{ parameters.Environment }}
  jobs:
  - job: validation
    displayName: Terraform Init and Validate ${{ parameters.Environment }}
    steps:
    - template: ../steps/init.yml
      parameters:
        wd: ${{ parameters.wd }}
        key: ${{ parameters.Environment }}.tfstate
        serviceConnection: ${{ parameters.serviceConnection }}

    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '${{ parameters.wd }}'