parameters:
- name: Environment
  type: string

- name: wd
  type: string 

stages:
- stage: Plan_${{ parameters.Environment }}
  displayName: Terraform Init and Plan ${{ parameters.Environment }}
  jobs:
  - job: Plan
    displayName: Terraform Init and Plan ${{ parameters.Environment }}
    steps:
    - template: ../steps/init.yml
      parameters: 
        wd: $(System.DefaultWorkingDirectory)/landing_zone_practice/Template/steps
        key: ${{parameters.Environment}}.tfstate

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '${{ parameters.wd }}'
        environmentServiceNameAzureRM: 'Practice_service_connection'
