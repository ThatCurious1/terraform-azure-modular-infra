parameters:
- name: Environment
  type: string

- name: wd
  type: string

- name: serviceConnection
  type: string
  # default: 'Practice_service_connection'

stages:
- stage: Plan_${{ parameters.Environment }}
  displayName: Terraform Init and Plan ${{ parameters.Environment }}
  jobs:
  - job: Plan
    displayName: Terraform Init and Plan ${{ parameters.Environment }}
    steps:
    - template: ../steps/init.yml
      parameters:
        wd: ${{ parameters.wd }}
        key: ${{ parameters.Environment }}.tfstate
        serviceConnection: ${{ parameters.serviceConnection }}

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '${{ parameters.wd }}'
        environmentServiceNameAzureRM: '${{ parameters.serviceConnection }}'