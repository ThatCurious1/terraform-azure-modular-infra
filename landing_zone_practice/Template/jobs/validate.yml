parameters:
- name: Environment
  type: string

- name: wd
  type: string

- name: serviceConnection
  type: string

jobs:
- job: Validate
  displayName: Validate-${{ parameters.Environment }}
  steps:
  - template: ../steps/init.yml
    parameters: 
      wd: ${{ parameters.wd }}
      key: ${{ parameters.Environment }}.tfstate
      serviceConnection: ${{ parameters.serviceConnection }}
  
  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '${{ parameters.wd }}'