parameters:
- name: Environment
  type: string

jobs:
- job: TerraformValidate
  displayName: Terraform Init and Validate
  
  steps:

  - template: ../steps/init.yml
    parameters:
      wd: '$(Build.SourcesDirectory)/landing_zone_practice/environments/${{ parameters.Environment }}'
  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(Build.SourcesDirectory)/landing_zone_practice/environments/${{ parameters.Environment }}'