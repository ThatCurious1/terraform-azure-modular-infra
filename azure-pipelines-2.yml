trigger: none
pool:
 vmImage: ubuntu-latest
parameters: 
- name: env
  displayName: Select Environment
  default: dev
  values:
    - dev
    - prod


variables: 
- ${{ if eq(parameters.env, 'dev')}}:
  - group: VG-dev
- ${{ if eq(parameters.env, 'prod')}}:
  - group: VG-prod
- name: wd
  value:  $(System.DefaultWorkingDirectory)/Environment/${{ parameters.env}}
- name: sc
  value: Practice_service_connection
resources:
  repositories:
    - repository: narayan
      endpoint: github.com_ThatCurious1
      type: github
      name: ThatCurious1/Templates
      ref: refs/tags/V1.2
stages:
- template: validate.yml@narayan
  parameters:
    wd: $(wd)
    env: ${{ parameters.env }}
    sc: $(sc)
- template: plan.yml@narayan
  parameters:
    wd: $(wd)
    env: ${{ parameters.env }}
    sc: $(sc)
- template: apply.yml@narayan
  parameters:
      wd: $(wd)
      env: ${{ parameters.env }}
      sc: $(sc)